<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno del profesor · Evaluación y Corrector</title>
<meta name="theme-color" content="#0a1120">
<!-- Ajustes para usarla como app desde la pantalla de inicio en iPad/iPhone (Safari > Compartir > Añadir a pantalla de inicio) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eval. y Corrector">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/una-ventana.js" data-app="cuaderno" data-nombre="El Cuaderno del profesor"></script>
<script src="js/bloqueo.js"></script>
<script src="js/registro-sw.js"></script>
</head>
<body>
<header id="appHeader">
  <div class="wrap">
    <div class="flex" style="justify-content:space-between">
      <div class="flex" style="gap:10px">
        <h1 style="cursor:pointer" onclick="irInicio()" id="pageH1">Cuaderno del profesor</h1>
        <button class="ghost" style="color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 13px;font-size:12.5px" onclick="buscarAbrir()" title="Buscar (Ctrl/Cmd + K)" aria-label="Buscar">🔍<span class="tb-txt"> Buscar</span></button>
        <button class="ghost" id="temaToggleBtn" style="color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 13px;font-size:12.5px" onclick="toggleTemaApp()" title="Cambiar modo claro/oscuro">🌙</button>
        <button class="ghost" id="proyectorBtn" aria-pressed="false" style="color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 13px;font-size:12.5px" onclick="toggleProyector()" title="Modo proyector: difumina los nombres del alumnado y las notas (para proyectar la pantalla)">👁️</button>
        <button class="ghost" id="bloqueoBtn" style="display:none;color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 13px;font-size:12.5px" onclick="BloqueoPIN.bloquear()" title="Bloquear la app ahora (pide el PIN para volver a entrar)" aria-label="Bloquear la app ahora">🔒</button>
        <button class="ghost" id="anchoToggleBtn" style="color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 13px;font-size:12.5px" onclick="toggleAnchoApp()" title="Alternar versión iPad / escritorio">🖥️</button>
      </div>
      <div class="flex" id="backupBar"></div>
    </div>
  </div>
</header>
<div class="grouptabs" id="groupTabs"></div>
<main id="app"></main>

<button id="cronoFab" class="crono-fab" onclick="cronoTogglePanel()" title="Herramientas de clase: cronómetro, sorteo y grupos" aria-label="Herramientas de clase: cronómetro, sorteo y grupos">⏱️</button>
<div id="cronoPanel" class="crono-panel" data-sin-privacidad>
  <div class="flex" style="justify-content:space-between;align-items:center;gap:6px;flex-wrap:nowrap">
    <div class="clase-tabs" role="tablist" aria-label="Herramientas de clase">
      <button class="tab on" role="tab" aria-selected="true" data-clase-tab="crono" onclick="claseIrTab('crono')">⏱️ Crono</button>
      <button class="tab" role="tab" aria-selected="false" data-clase-tab="sorteo" onclick="claseIrTab('sorteo')">🎲 Sorteo</button>
      <button class="tab" role="tab" aria-selected="false" data-clase-tab="grupos" onclick="claseIrTab('grupos')">👥 Grupos</button>
    </div>
    <button class="ghost" style="padding:3px 9px" onclick="cronoTogglePanel()" aria-label="Cerrar">✕</button>
  </div>
  <div id="claseCrono">
  <div class="crono-display" id="cronoDisplay">00:00</div>
  <div class="crono-quick">
    <button class="ghost" onclick="cronoIniciarMinutos(1)">1 min</button>
    <button class="ghost" onclick="cronoIniciarMinutos(5)">5 min</button>
    <button class="ghost" onclick="cronoIniciarMinutos(10)">10 min</button>
    <button class="ghost" onclick="cronoIniciarMinutos(15)">15 min</button>
    <button class="ghost" onclick="cronoIniciarMinutos(20)">20 min</button>
    <button class="ghost" onclick="cronoIniciarMinutos(30)">30 min</button>
    <button class="ghost" onclick="cronoIniciarMinutos(45)">45 min</button>
  </div>
  <div class="flex" style="margin-top:10px;gap:6px;align-items:center">
    <input type="number" id="cronoCustomMin" class="in" style="width:60px" placeholder="min" min="0" aria-label="Minutos">
    <span style="color:var(--mut)">:</span>
    <input type="number" id="cronoCustomSeg" class="in" style="width:60px" placeholder="seg" min="0" max="59" aria-label="Segundos">
    <button class="btn" style="flex:1" onclick="cronoIniciarCustom()">Iniciar</button>
  </div>
  <div class="flex" style="margin-top:12px;gap:8px">
    <button class="btn" id="cronoBtnPausar" style="flex:1" onclick="cronoTogglePausa()">⏸ Pausar</button>
    <button class="ghost" style="flex:1;border:1px solid var(--line)" onclick="cronoReiniciar()">↺ Reiniciar</button>
  </div>
  </div>
  <div id="claseOtra" hidden></div>
</div>
